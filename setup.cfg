[flake8]
max-line-length = 120
exclude = .git,__pycache__,venv,.venv,data,build,dist
# E203/W503 - black-compatibility
# E241/W504 - we deliberately align column-style code (tables, dict literals)
# E121/E124/E126/E127/E128/E131 - PEP8 vs. column-aligned hanging indents
# E221 - alignment before "=" in column-style assignments
ignore = E203,W503,E241,W504,E121,E124,E126,E127,E128,E131,E221

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
