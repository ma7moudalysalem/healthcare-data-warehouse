# Synthea configuration for the Healthcare Data Warehouse project.
# These overrides shape Synthea's output to match the proposal: 100K patients
# in CSV form, with FHIR/HL7 disabled to keep disk usage manageable.
#
# Only a subset of the full Synthea property surface is overridden; the rest
# inherit Synthea defaults.

# --- Population --------------------------------------------------------------
generate.default_population = 100000
generate.thread_pool_size = 4

# --- Geography (Egypt is not in Synthea's bundled demographics, so the
# generator runs against MA - Massachusetts - and we rewrite the address
# fields downstream in the Silver layer to fit the hospital network's region.)
generate.geography.country_code = US
generate.geography.timezones.default = America/New_York

# --- Output formats ----------------------------------------------------------
exporter.csv.export = true
exporter.csv.folder_per_run = false
exporter.fhir.export = false
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.hospital.fhir.export = false
exporter.hospital.fhir_stu3.export = false
exporter.practitioner.fhir.export = false
exporter.practitioner.fhir_stu3.export = false
exporter.text.export = false
exporter.cpcds.export = false
exporter.cdw.export = false
exporter.ccda.export = false

# Patient bundles only matter when FHIR is on, but the flag is harmless.
exporter.fhir.bulk_data = false

# --- Output paths ------------------------------------------------------------
# These paths are relative to the Synthea jar's working directory. The
# wrapper script (run_synthea.py) sets the working directory to
# src/synthea/, so output lands in src/synthea/output/csv/.
exporter.baseDirectory = ./output

# --- Simulation parameters --------------------------------------------------
generate.years_of_history = 8
generate.append_numbers_to_person_names = false
generate.middle_names = 0.6
generate.only_alive_patients = false
generate.only_dead_patients = false

# --- Module configuration ---------------------------------------------------
# Disable the dental and prescription modules' chattiest sub-modules to keep
# the encounter table to a manageable size for the warehouse.
exporter.years_of_history = 8
generate.veterans_population_override = false
