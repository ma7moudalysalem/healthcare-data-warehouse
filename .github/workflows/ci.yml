name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install flake8
      - run: flake8 src/ tests/ pipelines/ dashboards/ --max-line-length=120 --exclude=__pycache__,build,dist

  unit:
    name: Unit tests (no Spark)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps
        run: |
          pip install pandas numpy pyarrow faker flask requests pytest matplotlib seaborn plotly
      - name: Run pytest (excluding Spark tests)
        run: pytest tests/ -v --tb=short --ignore=tests/test_silver_common.py

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  spark-tests:
    name: Spark tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_silver_common.py -v --tb=short

  sql-lint:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install sqlfluff
      # tsql dialect is an approximation for Synapse - we accept warnings.
      - run: sqlfluff lint sql/ --dialect tsql

  docker-build:
    name: Docker build + security scan (deployed images)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      # Build + scan the images ACTUALLY deployed to Azure Container Apps
      # (scripts/deploy_all.sh ships dashboard-db + provider-api), so CI validates
      # the real artifacts instead of the demo/generator images.
      - name: Build dashboard image (live, Azure SQL)
        run: docker build -f docker/Dockerfile.dashboard-db -t hcdw-dashboard:ci .
      - name: Build provider API image
        run: docker build -f docker/Dockerfile.provider-api -t hcdw-provider-api:ci .
      - name: Trivy scan — dashboard image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hcdw-dashboard:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Trivy scan — provider API image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hcdw-provider-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  docs:
    name: Docs / Markdown
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            dashboards/**/*.md
            pipelines/**/*.md
            *.md
        continue-on-error: true
